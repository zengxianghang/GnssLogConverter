name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify automatic MSVC build script
        if: runner.os == 'Windows'
        shell: cmd
        run: build_vs2022.bat

      - name: Test position converter CSV to INSPVA
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -pedantic tools/pos_convert/pos_convert.cpp -o /tmp/pos_convert
          python3 tools/pos_convert/tests/test_csv_to_inspva.py /tmp/pos_convert

      - name: Verify position converter Visual Studio build
        if: runner.os == 'Windows'
        shell: cmd
        run: tools\pos_convert\build_pos_convert.bat nopause
